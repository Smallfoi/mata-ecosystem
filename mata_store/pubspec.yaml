name: sport_store
description: "SportStore — спортивная одежда и экипировка"
publish_to: 'none'

version: 0.1.4+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  badges: ^3.1.2
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  http_parser: ^4.0.2
  reorderable_grid_view: ^2.2.8
  sentry_flutter: ^9.26.0
  video_player: ^2.10.1
  qr_flutter: ^4.1.0
  # Общие виджеты экосистемы (карта лояльности, знак, маска телефона) — D-126.
  mata_ui:
    path: ../packages/mata_ui
  url_launcher: ^6.3.1  # открыть банковское приложение по ссылке СБП
  package_info_plus: ^8.1.1  # текущий versionCode для проверки обновлений

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/products/
    - assets/fonts/
