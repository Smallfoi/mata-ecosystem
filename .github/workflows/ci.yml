name: CI

# Проверки качества для монорепо экосистемы МАТА.
# Гоняются на каждый push в main и на каждый Pull Request в main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем устаревшие прогоны для той же ветки/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Имена job («Flutter · kvartal-app/sport_store») зафиксированы в required
        # checks защиты main — сохраняем их; папки переименованы (D-34):
        # kvartal-app → mata_kvartal, sport_store → mata_store.
        include:
          # «Лига» (D-59) стала Кварталом 05.09.2026 (D-70): dev-приложение
          # удалено, его кодовая база теперь и есть mata_kvartal.
          - app: kvartal-app
            dir: mata_kvartal
          - app: sport_store
            dir: mata_store
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 (пин по SHA, F05)
        with:
          flutter-version: 3.32.1
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  backend:
    name: Backend · Django
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: kvartal
          POSTGRES_USER: kvartal
          POSTGRES_PASSWORD: kvartal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: kvartal
      POSTGRES_USER: kvartal
      POSTGRES_PASSWORD: kvartal
    defaults:
      run:
        working-directory: backend/django_api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Тот же Python, что в прод-образе (Dockerfile: python:3.12.14-slim-trixie).
          python-version: '3.12.14'

      # Ровно те версии, что поедут в прод (F05): requirements.txt — что нужно,
      # requirements.lock — точные версии (constraints). Так же ставит Dockerfile.
      - name: Install deps
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt -c requirements.lock

      # Добавили пакет в requirements.txt, а lock не обновили — он встал бы «последней
      # версией» и на проде мог оказаться не тем, что проверено здесь.
      - name: Lock guard (установлено == requirements.lock)
        run: python ../../tools/check_requirements_lock.py requirements.lock

      - name: Django system check
        run: python manage.py check

      # Модель поменяли, миграцию не сделали — прод (migrate при старте web) разойдётся
      # со схемой из кода (F06).
      - name: Missing migrations guard
        run: python manage.py makemigrations --check --dry-run

      # Прод-настройки (DEBUG=0): HSTS/secure-cookie/SSL-redirect и прод-страховка
      # common.prodcheck. Значения — фиктивные, генерируются на лету (F06).
      - name: Deploy settings check (DEBUG=0)
        env:
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: api.example.com
          POSTGRES_PASSWORD: ci-fake-not-used-for-connect
          # Обязательны в проде (строгая проверка D09): check к ним не подключается.
          REDIS_URL: redis://localhost:6379/0
          DJANGO_CORS_ORIGINS: https://example.com
        run: |
          DJANGO_SECRET_KEY="ci-$(openssl rand -hex 32)"
          JWT_SECRET="ci-$(openssl rand -hex 32)"
          export DJANGO_SECRET_KEY JWT_SECRET
          python manage.py check --deploy --fail-level WARNING

      - name: Tests (анти-чит + эндпоинты)
        run: python manage.py test --verbosity 2

      # Известные уязвимости в зафиксированных версиях (F06). НЕ блокирует сборку:
      # найденное видно в логе/сводке прогона, обновление — отдельным PR с новым lock.
      - name: Dependency audit (pip-audit, не блокирует)
        continue-on-error: true
        run: |
          python -m venv /tmp/pip-audit-venv
          /tmp/pip-audit-venv/bin/pip install -q pip-audit==2.10.1
          /tmp/pip-audit-venv/bin/pip-audit -r requirements.lock --no-deps --disable-pip \
            --progress-spinner off --desc on 2>&1 | tee /tmp/pip-audit.txt
          status=${PIPESTATUS[0]}
          { echo '### pip-audit (requirements.lock)'; echo '```'; cat /tmp/pip-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  site-js:
    name: Site · JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужен main целиком: сравниваем метку версии с базовой

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Синтакс-гейт клиентского JS сайта (content.js/editor.js/promo.js и др.):
      # node --check ловит рецидивные синтакс-ошибки, ломавшие витрину/конструктор,
      # и НЕ завязан на поведение (не бьётся при легитимных правках логики).
      - name: Syntax-check site JS (node --check)
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do
            echo "node --check: $f"
            node --check "$f"
            count=$((count + 1))
          done < <(find "САЙТ МАТА" -maxdepth 1 -name '*.js' | sort)
          echo "checked $count file(s)"
          test "$count" -gt 0   # страховка: путь с кириллицей нашёлся, файлы проверены

      # Поведенческие тесты сайта без браузера: функции вырезаются из исходника
      # и гоняются в node с заглушками DOM (профиль: ошибка заказов без демо, адреса по аккаунту).
      - name: Site behaviour tests (node --test)
        run: node --test tools/site_tests/*.test.js

      # Браузер запоминает styles.css?v=20260702 и при следующем заходе берёт его
      # из своей памяти: адрес не изменился. Меняем файл, не сдвинув метку —
      # владелец на своём телефоне видит СТАРУЮ вёрстку, сколько ни выкатывай
      # (так и вышло с мобильными правками). Подробности: tools/check_site_cache_bust.py.
      - name: Cache-bust guard (одна метка ?v= на все страницы)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python tools/check_site_cache_bust.py --base origin/main

  # Браузерный smoke сайта (аудит F06): витрина в headless Chromium с подменённым
  # API — карточка из /v1/models в сетке, фильтр из /v1/categories, без JS-ошибок.
  # Отдельная джоба, не входит в обязательные проверки защиты main.
  site-smoke:
    name: Site · Browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Catalog smoke (static site + mocked API)
        run: python tools/site_smoke.py

  editable-guard:
    name: CMS · Editable text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Страж редактируемости: на НОВОМ экране приложения не должно быть текста-контента
      # мимо RemoteText (иначе владелец не сможет править его в Конструкторе). Существующий
      # статичный UI — в baseline; осознанный статик помечается // staw-static. Подробности:
      # tools/check_editable_text.py.
      - name: Editable-text guard (RemoteText / staw-static)
        run: python tools/check_editable_text.py

      # Единый стиль админки (D-87): страницы не заводят свой <style>, а берут блоки
      # из static/admin/mata.css. Иначе разделы снова начнут расходиться в мелочах.
      - name: Admin-style guard (один стиль на всю админку)
        run: python tools/check_admin_styles.py

  deploy-scripts:
    name: Deploy · scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Скрипты эксплуатации (backend/deploy/*.sh) крутятся на проде кроном и руками
      # владельца — синтаксис, shellcheck и модельные прогоны с заглушками docker/curl/git
      # (backend/deploy/tests). Прод/облако НЕ трогаются. DEPLOY_TEST_REAL_PG=1 — restore
      # дополнительно гоняется на настоящем postgis в одноразовом контейнере.
      - name: bash -n + shellcheck + модельные прогоны
        env:
          DEPLOY_TEST_REAL_PG: '1'
        run: |
          set -euo pipefail
          for f in backend/deploy/*.sh backend/deploy/tests/*.sh; do bash -n "$f"; done
          shellcheck -S error backend/deploy/*.sh backend/deploy/tests/*.sh
          bash backend/deploy/tests/run_all.sh

  # Поиск секретов в НОВЫХ коммитах (F06). Репозиторий публичный — утёкший ключ
  # виден всем. Отдельная джоба, НЕ в required checks и НЕ блокирует (continue-on-error):
  # находки видны в логе/сводке прогона. Сканируем только новые коммиты (PR — всё, что
  # сверх main; push в main — последний коммит): в истории есть известные ложные
  # срабатывания (тестовые пароли, ключи SharedPreferences, ID секретов Lockbox).
  secrets-scan:
    name: Security · Secrets scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (новые коммиты, не блокирует)
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            range="origin/$BASE_REF..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "range: $range"
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --log-opts="$range" 2>&1 | tee /tmp/gitleaks.txt
          status=${PIPESTATUS[0]}
          { echo '### gitleaks'; echo '```'; cat /tmp/gitleaks.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
