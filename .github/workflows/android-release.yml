name: Android release

# Сборка ПОДПИСАННОГО release-APK и выкладка в S3 для тестеров.
# РЕЛИЗ-ПОЕЗД (D-58): выпуск НЕ на каждый мерж, а вручную — обычно раз в конце дня,
# чтобы накопленные за день правки уехали тестерам ОДНИМ обновлением (меньше
# скачиваний; человеческая версия растёт раз в релиз). Мержи в main в течение дня
# только проверяются через CI (ci.yml/ios-build.yml), тестерам не уходят.
# Запуск: вкладка Actions → «Android release» → Run workflow → выбрать приложения.
#
# Ключ подписи и S3-креды — из secrets репозитория:
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD
#   MEDIA_S3_ACCESS_KEY / MEDIA_S3_SECRET_KEY
# versionCode = число коммитов (git rev-list --count) — монотонно растёт, одинаков
# в сборке (--build-number) и в version.json, по нему приложение видит обновление.
on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Какие приложения релизить'
        type: choice
        options: [both, kvartal, store]
        default: both

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: kvartal
            dir: mata_kvartal
            alias: mata_kvartal
          - app: store
            dir: mata_store
            alias: mata_store
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # нужно для git rev-list --count и diff

      - name: Select apps
        id: detect
        run: |
          # Релизим приложение, если выбрано «both» или именно оно.
          if [ "${{ inputs.apps }}" = "both" ] || [ "${{ inputs.apps }}" = "${{ matrix.app }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.app }} не выбран — пропуск."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.changed == 'true'
        with:
          flutter-version: 3.32.1
          channel: stable
          cache: true

      - name: Restore keystore + key.properties
        if: steps.detect.outputs.changed == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/mata-release.jks"
          cat > "${{ matrix.dir }}/android/key.properties" <<EOF
          storeFile=$RUNNER_TEMP/mata-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ matrix.alias }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed APK
        if: steps.detect.outputs.changed == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          VERSION_NAME=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:\s*//' | cut -d+ -f1 | tr -d '[:space:]')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          flutter pub get
          # Только arm64 (все современные телефоны) — APK ~вдвое легче универсального.
          # SENTRY_DSN — из секрета: пуст → крэш-репортинг no-op (D-32), появится
          # секрет → включится без правок кода. SENTRY_RELEASE привязывает крэши к
          # конкретной сборке (app@version+build).
          flutter build apk --release --target-platform android-arm64 --build-number="$BUILD_NUMBER" \
            --dart-define=CARTO_API_KEY="${{ secrets.CARTO_API_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=SENTRY_RELEASE="${{ matrix.app }}@$VERSION_NAME+$BUILD_NUMBER"

      - name: Publish to S3
        if: steps.detect.outputs.changed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEDIA_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_S3_SECRET_KEY }}
          APP: ${{ matrix.app }}
          APK_PATH: ${{ matrix.dir }}/build/app/outputs/flutter-apk/app-release.apk
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          GIT_SHA: ${{ github.sha }}
          NOTES: ${{ github.event.head_commit.message }}
          BUILT_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          pip install boto3
          python tools/upload_apk.py
