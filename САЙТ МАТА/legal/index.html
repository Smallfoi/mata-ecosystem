<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Документы — МАТА</title>
    <meta
      name="description"
      content="Юридические документы МАТА: политика конфиденциальности, пользовательское соглашение, оферта, правила программы лояльности."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Общие стили сайта: цвета, шрифты, типографика. -->
    <link rel="stylesheet" href="../styles.css?v=20260911a" />
    <style>
      /* Страница документа. Отдельный адрес нужен для ссылок наружу: партнёрские
         программы (Garmin, Suunto) и проверка приложения в App Store требуют
         рабочую ссылку на политику, а модалка на главной такой ссылки не даёт. */
      .doc-page {
        max-width: 820px;
        margin: 0 auto;
        padding: clamp(28px, 6vw, 64px) var(--pad-x) clamp(48px, 8vw, 96px);
      }
      .doc-back {
        display: inline-block;
        margin-bottom: clamp(20px, 3vw, 32px);
        color: var(--graphite);
        font-size: 14px;
        text-decoration: none;
      }
      .doc-back:hover { color: var(--ink); }
      .doc-title {
        margin: 0 0 8px;
        font-family: var(--font-display);
        font-size: clamp(26px, 4vw, 40px);
        line-height: 1.15;
      }
      .doc-meta {
        margin: 0 0 clamp(24px, 4vw, 40px);
        color: var(--graphite);
        font-size: 13px;
      }
      .doc-body { color: var(--ink); font-size: 16px; line-height: 1.7; }
      .doc-body h2 { margin: 32px 0 12px; font-size: clamp(19px, 2.4vw, 24px); }
      .doc-body h3 { margin: 24px 0 10px; font-size: 17px; }
      .doc-body p, .doc-body li { color: var(--graphite); }
      .doc-body ul, .doc-body ol { padding-left: 22px; }
      .doc-body li { margin-bottom: 6px; }
      .doc-body table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 14px; }
      .doc-body th, .doc-body td { padding: 8px 10px; border: 1px solid var(--line); text-align: left; }
      .doc-body code {
        padding: 2px 6px;
        border-radius: 5px;
        background: rgba(17, 19, 23, 0.06);
        font-size: 14px;
      }
      /* Широкая таблица не должна растягивать страницу вбок на телефоне. */
      .doc-scroll { overflow-x: auto; }
      .doc-others {
        margin-top: clamp(40px, 6vw, 72px);
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }
      .doc-others h2 { margin: 0 0 14px; font-size: 15px; letter-spacing: 0.4px; text-transform: uppercase; }
      .doc-others ul { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .doc-others a { color: var(--graphite); font-size: 15px; text-decoration: none; }
      .doc-others a:hover { color: var(--ink); }
      .doc-others a[aria-current="page"] { color: var(--ink); font-weight: 600; }
    </style>
  </head>

  <body>
    <main class="doc-page">
      <a class="doc-back" href="/">← На главную</a>
      <h1 class="doc-title" data-doc-title>Загрузка…</h1>
      <p class="doc-meta" data-doc-meta></p>
      <div class="doc-body doc-scroll" data-doc-body></div>

      <nav class="doc-others">
        <h2>Все документы</h2>
        <ul data-doc-list></ul>
      </nav>
    </main>

    <!-- Загрузка документов и разбор markdown — те же, что у модалки на главной
         (legal.js экспортирует их в window.STAW_LEGAL). Второй реализации нет. -->
    <script src="../legal.js?v=20260911a"></script>
    <script src="../legal-page.js?v=20260911a"></script>
  </body>
</html>
