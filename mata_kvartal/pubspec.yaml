name: kvartal_app
description: "МАТА Лига — беговое приложение экосистемы МАТА: своя лига для каждого бегуна."
publish_to: 'none'

version: 0.2.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.6.3

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Векторные тайлы OpenFreeMap (стиль Bright), D-19 — коммерч.-безопасная подложка.
  vector_map_tiles: ^8.0.0

  # GPS
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Charts
  fl_chart: ^0.70.2

  # Animations
  flutter_animate: ^4.5.2

  # HTTP
  dio: ^5.8.0+1

  # Local storage
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

  # Локальные напоминания (напр. о старте забега из «Моих стартов»). Только device-local,
  # без пушей/FCM. timezone — для zonedSchedule.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Шаринг-карточка пробежки (Ф1 «Праздник»): рендер RepaintBoundary → PNG → share.
  share_plus: ^10.1.4

  # Открытие внешних ссылок (напр. страница регистрации на забег).
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1  # текущий versionCode для проверки обновлений

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.7
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.1.2

  # Звук + вибрация для инструментов (метроном, интервальный таймер).
  # audioplayers + пул плееров (round-robin) — для надёжного быстрого повтора звуков.
  audioplayers: ^6.1.0
  vibration: ^3.0.0
  sentry_flutter: ^9.26.0
  health: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/zones.json
    - assets/audio/
    # «Штамп МАТА»: 44 аверса + 5 реверсов, выгружены из эталона
    # docs/design/medals/ (WebP 768px, попиксельно тот рендер, что утверждён).
    - assets/medals/
    # Живые эмблемы: база+слои послойного экспорта (пилот, конвейер партиями).
    - assets/medals/anim/

  # Квартал 2.0 (Ф8): Manrope — дисплей/заголовки, Inter — текст и данные.
  # Unbounded остаётся зарегистрированным для знака «КВАРТАЛ» на сплэше.
  fonts:
    # Слово «Instagram» на кнопках шаринга — фирменным курсивом (Grand Hotel,
    # OFL: открытый двойник логотайпа Инсты; сам Billabong проприетарен).
    - family: GrandHotel
      fonts:
        - asset: assets/fonts/GrandHotel-Regular.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-600.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-700.ttf
          weight: 700
        - asset: assets/fonts/Unbounded-800.ttf
          weight: 800
