# Стек бэкенда экосистемы STAW: Django 5 + DRF + PostgreSQL/PostGIS + Redis + Celery.
# Единый общий бэкенд для всех 3 продуктов на :8000 (прежний FastAPI удалён, D-12).
#
# Запуск (когда Docker Desktop работает):  cd backend && docker compose up -d
#   web    — Django на :8000 (приложения ходят сюда, adb reverse tcp:8000)
#   worker — Celery-воркер (фоновые пуши, тяжёлые задачи; D-07)
#   beat   — Celery-планировщик (чистка территорий по расписанию; D-07)

# Общая среда/тома Django-процессов (web/worker/beat) — один образ, один код, один Redis.
x-django-env: &django-env
  DJANGO_DEBUG: "1"
  DJANGO_SECRET_KEY: dev-secret-change-in-prod
  POSTGRES_DB: kvartal
  POSTGRES_USER: kvartal
  POSTGRES_PASSWORD: kvartal
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0   # общий кэш (OTP/лимиты/бан) + брокер Celery

x-django-volumes: &django-volumes
  - ./django_api:/app
  # Фото товаров (dev): отдаём существующие ассеты Store по сети как /media/products/*,
  # чтобы Квартал показывал мини-фото кроссовок. Прод — реальный CDN/медиа-хранилище.
  - ../mata_store/assets/images/products:/srv/media/products:ro
  # Загруженные через админку фото — отдельный записываемый том (/media/uploads/*).
  - media_uploads:/srv/media/uploads

services:
  db:
    # 16-3.4 — самый точный тег PostGIS (патч-тегов нет); не менялся с 14.10.2024 (digest
    # sha256:44126d87…). Строку образа НЕ трогаем: её смена = пересоздание БД при автодеплое (F05).
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: kvartal
      POSTGRES_USER: kvartal
      POSTGRES_PASSWORD: kvartal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvartal -d kvartal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Точная версия (F05): «7-alpine» плавал; 7.4.11 = текущий 7-alpine (сверено по digest 28.09.2026).
    image: redis:7.4.11-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./django_api
    command: python manage.py runserver 0.0.0.0:8000
    environment: *django-env
    volumes: *django-volumes
    ports:
      - "8000:8000"   # Django на хосте :8000 — приложения ходят сюда (adb reverse tcp:8000).
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./django_api
    command: celery -A config worker -l info
    environment: *django-env
    volumes: *django-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./django_api
    command: celery -A config beat -l info
    environment: *django-env
    volumes: *django-volumes
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  media_uploads:
