# Прод-стек STAW backend (Django+gunicorn + PostGIS + nginx).
# Запуск:  cd backend && cp .env.prod.example .env && <заполнить .env> && \
#          docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Подробности и чеклист — docs/DEPLOY.md.
services:
  db:
    # 16-3.4 — самый точный тег PostGIS (патч-тегов нет); не менялся с 14.10.2024 (digest
    # sha256:44126d87…). Строку образа НЕ трогаем: её смена = пересоздание БД при автодеплое (F05).
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Данные БД — на ОТДЕЛЬНОМ постоянном диске (bind-mount /mnt/data), а не в
      # named-volume на boot-диске: переживает пересоздание ВМ (диск autoDelete=false).
      # cloud-init монтирует диск в /mnt/data ДО старта стека (иначе деплой падает).
      - /mnt/data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу НЕ публикуем — доступ к БД только из web-контейнера.

  redis:
    # Точная версия (F05): «7-alpine» плавал; 7.4.11 = текущий 7-alpine (сверено по digest 28.09.2026).
    image: redis:7.4.11-alpine
    restart: always
    # Общий кэш для rate-limit/OTP/бана/баланса (D-07/D-28). LRU + лёгкая персистентность.
    # Вытеснение (allkeys-lru) для КЭША — норма; брокер Celery здесь больше НЕ живёт (E04).
    command: redis-server --save 60 1 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Брокер Celery — ОТДЕЛЬНЫЙ инстанс (аудит E04). В общем кэше с allkeys-lru при нехватке
  # памяти Redis молча выкидывал бы очереди задач (пуши, чистка по 152-ФЗ, фотопайплайн).
  # noeviction: при переполнении запись отвергается ОШИБКОЙ (видно в логах), а не теряется
  # молча; AOF — очередь переживает рестарт контейнера. Политика вытеснения — на весь
  # инстанс, поэтому «другая БД в том же Redis» не спасает: нужен свой процесс.
  redis-broker:
    image: redis:7.4.11-alpine
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redisbroker:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./django_api
    restart: always
    env_file: .env
    # Миграции + сбор статики + gunicorn (3 воркера). collectstatic — для админки.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    environment:
      # Брокер — отдельный redis-broker (E04). environment перекрывает env_file, поэтому
      # .env на ВМ (его пишут prod-deploy.sh/refresh-env.sh) менять не нужно.
      CELERY_BROKER_URL: redis://redis-broker:6379/0
    volumes:
      - media_uploads:/srv/media/uploads
      - static_files:/app/staticfiles
      # Юр-документы (docs/legal/*.md в корне репо, вне build-контекста web) — read-only,
      # для manage.py publish_legal. git reset обновляет файлы на месте (каталог не удаляется).
      - ../docs/legal:/legal_docs:ro
    expose:
      - "8000"   # только внутри сети compose; наружу — через nginx
    # Готовность (аудит E05): /v1/health/ready отдаёт 200 только при живых БД и кэше.
    # Host — первый из DJANGO_ALLOWED_HOSTS, X-Forwarded-Proto: https — как в smoke.sh
    # (иначе 400 DisallowedHost / 301 на https, см. PITFALLS). start_period покрывает
    # migrate + collectstatic на старте.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; h=(os.environ.get('DJANGO_ALLOWED_HOSTS') or '').split(',')[0].strip().lstrip('.'); h=h if h and h!='*' else '127.0.0.1'; u.urlopen(u.Request('http://127.0.0.1:8000/v1/health/ready', headers={'Host': h, 'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

  # Фоновые задачи (D-07). БЕЗ них в проде не работают: ежедневная чистка данных
  # с истёкшим сроком хранения (cleanup_old_data — требование 152-ФЗ), чистка
  # территорий, авто-парсер афиши «Стартов», рассылка пушей.
  worker:
    build: ./django_api
    restart: always
    env_file: .env
    command: celery -A config worker -l info --concurrency 2
    environment:
      CELERY_BROKER_URL: redis://redis-broker:6379/0   # E04, см. web
    volumes:
      - media_uploads:/srv/media/uploads
    # E05: воркер отвечает на ping через брокер (жив процесс И есть связь с очередью).
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null 2>&1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

  beat:
    build: ./django_api
    restart: always
    env_file: .env
    command: celery -A config beat -l info
    environment:
      CELERY_BROKER_URL: redis://redis-broker:6379/0   # E04, см. web
    volumes:
      - media_uploads:/srv/media/uploads
    # E05: у beat нет ping-команды; процесс — PID 1 (умер → контейнер перезапустится),
    # проверяем, что ему есть куда класть задачи — брокер отвечает.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.Redis.from_url(os.environ.get('CELERY_BROKER_URL') or os.environ['REDIS_URL'], socket_timeout=5).ping()"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

  nginx:
    # Точная версия (F05): 1.27.5 = тот же образ, что 1.27-alpine (одинаковый digest).
    image: nginx:1.27.5-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/mata.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro         # TLS-сертификаты (deploy/tls.sh)
      - ./nginx/certbot-www:/var/www/certbot:ro   # ACME-проверка при обновлении (без простоя)
      - /opt/mata-site:/usr/share/nginx/site:ro   # статика САЙТ МАТА (mata-club.ru)
      - media_uploads:/srv/media/uploads:ro
      - static_files:/srv/static:ro
    depends_on:
      - web

volumes:
  redisdata:
  redisbroker:
  media_uploads:
  static_files:
